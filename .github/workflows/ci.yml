name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: check (22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit
          npm run typecheck -w @metabot/rulespack
          npm run typecheck -w @metabot/rulespack-adapter
          npm run typecheck -w @xvirobotics/arc-mcp
          npm run typecheck -w @xvirobotics/worker-runner-mcp

      # Workspace test suites (packages/cli, metamemory, skill-hub) import the
      # compiled entry of these thin libraries (@xvirobotics/cli-core etc.,
      # exports -> dist/). `tsc --noEmit` above does not emit, so build them
      # before running tests or the imports fail to resolve. Build the retained
      # runtime packages here too so their independently shipped binaries and
      # restart preflight are covered.
      # The controlled-restart CLI tests run the production runtime-artifact
      # preflight, which requires both compiled ARC adapters. RulesPack's
      # adapter also imports the engine's compiled public entry during tests.
      - name: Build workspace libraries and restart prerequisites
        run: >-
          npm run build
          -w @xvirobotics/cli-core
          -w @xvirobotics/metamemory
          -w @xvirobotics/skill-hub
          -w @metabot/rulespack
          -w @metabot/rulespack-adapter
          -w @xvirobotics/arc-mcp
          -w @xvirobotics/worker-runner-mcp
          -w @xvirobotics/arc-researchclaw-adapter
          -w @xvirobotics/arc-worker-runner-adapter

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm run build
