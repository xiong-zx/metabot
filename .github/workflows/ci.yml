name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: check (22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit
          npm run typecheck -w @xvirobotics/arc-mcp

      # Workspace test suites (packages/cli, metamemory, skill-hub) import the
      # compiled entry of these thin libraries (@xvirobotics/cli-core etc.,
      # exports -> dist/). `tsc --noEmit` above does not emit, so build them
      # before running tests or the imports fail to resolve. Build ARC here too
      # so the independently shipped stdio binary is covered in the check job.
      - name: Build workspace libraries
        run: npm run build -w @xvirobotics/cli-core -w @xvirobotics/metamemory -w @xvirobotics/skill-hub -w @xvirobotics/arc-mcp

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm run build
